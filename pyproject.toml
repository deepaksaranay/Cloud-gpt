[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-gpt"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cloud-gpt-mcp-server = "cloud_gpt.mcp_server.server:main"
cloud-gpt-physics-api = "cloud_gpt.physics_api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
